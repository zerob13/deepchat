name: Create Release

on:
  workflow_dispatch:
    inputs:
      workflow_id:
        description: '构建工作流运行ID'
        required: true
        type: string
      prerelease:
        description: '是否为预发布版本'
        required: true
        type: boolean
        default: false
      use_existing_release:
        description: '是否使用已存在的 release?'
        required: true
        type: boolean
        default: false
      release_tag:
        description: '如果使用已存在的 release，请提供 tag 名称 (如: v1.0.0)'
        required: false
        type: string

# 确保同一时间只运行一个相同的 workflow，取消正在进行的旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.workflow_id }}
  cancel-in-progress: true

jobs:
  prepare-artifacts:
    runs-on: ubuntu-latest
    name: 准备发布资源
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      has_windows_x64: ${{ steps.check_artifacts.outputs.has_windows_x64 }}
      has_windows_arm64: ${{ steps.check_artifacts.outputs.has_windows_arm64 }}
      has_linux_x64: ${{ steps.check_artifacts.outputs.has_linux_x64 }}
    steps:
      - name: Download artifacts from workflow
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.inputs.workflow_id }}
          path: artifacts

      - name: 列出下载的构建产物
        run: find artifacts -type f | sort

      - name: 检查构建产物
        id: check_artifacts
        run: |
          if [ -d "artifacts/deepchat-win-x64" ]; then
            echo "has_windows_x64=true" >> $GITHUB_OUTPUT
            echo "✅ 发现 Windows x64 构建产物"
          else
            echo "has_windows_x64=false" >> $GITHUB_OUTPUT
            echo "❌ 未发现 Windows x64 构建产物"
          fi

          if [ -d "artifacts/deepchat-win-arm64" ]; then
            echo "has_windows_arm64=true" >> $GITHUB_OUTPUT
            echo "✅ 发现 Windows ARM64 构建产物"
          else
            echo "has_windows_arm64=false" >> $GITHUB_OUTPUT
            echo "❌ 未发现 Windows ARM64 构建产物"
          fi

          if [ -d "artifacts/deepchat-linux-x64" ]; then
            echo "has_linux_x64=true" >> $GITHUB_OUTPUT
            echo "✅ 发现 Linux x64 构建产物"
          else
            echo "has_linux_x64=false" >> $GITHUB_OUTPUT
            echo "❌ 未发现 Linux x64 构建产物"
          fi

      - name: 获取版本号
        id: get_version
        run: |
          # 尝试从构建产物中提取版本号
          VERSION_FILE=""

          # 尝试从Linux包中获取版本号
          if [ -d "artifacts/deepchat-linux-x64" ]; then
            VERSION_FILE=$(find artifacts/deepchat-linux-x64 -name "DeepChat-*.tar.gz" | head -n 1)
          fi

          # 如果没有Linux包，尝试从Windows包中获取版本号
          if [ -z "$VERSION_FILE" ] && [ -d "artifacts/deepchat-win-x64" ]; then
            VERSION_FILE=$(find artifacts/deepchat-win-x64 -name "DeepChat-*.exe" | head -n 1)
          fi

          if [ -n "$VERSION_FILE" ]; then
            VERSION=$(echo $VERSION_FILE | grep -o 'DeepChat-[0-9]\+\.[0-9]\+\.[0-9]\+' | sed 's/DeepChat-//')
            echo "从构建产物中提取的版本号: $VERSION"
          else
            echo "错误: 无法从构建产物中提取版本号"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 发布版本: $VERSION"

